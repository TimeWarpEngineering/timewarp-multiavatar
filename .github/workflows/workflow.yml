name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode. merge = build and test only (default). dry = build and pack without publish. release = break-glass publish; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - dry
          - release
          - probe
        default: merge
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Validate break-glass confirmation
      if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
      run: |
        echo "::error::mode=release requires confirm=release. Refusing break-glass publish."
        exit 1

    # --- merge mode (push / PR / dispatch merge): build + test ---
    - name: Restore dependencies (CI)
      if: >-
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'merge')
      run: dotnet restore

    - name: Build (CI)
      if: >-
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'merge')
      run: dotnet build --no-restore --configuration Release

    - name: Test
      if: >-
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'merge')
      run: dotnet test --no-build --verbosity normal --configuration Release

    # --- release / dry / release:published: version, build, pack, optional push ---
    - name: Resolve version
      if: >-
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'dry'))
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        else
          # Break-glass / dry-run: use props SSOT (tag may not exist yet)
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
        fi
        VERSION="${VERSION#v}"
        if [ -z "$VERSION" ]; then
          echo "::error::Could not resolve package version"
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Resolved VERSION=$VERSION"

    - name: Restore dependencies (release)
      if: >-
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'dry'))
      run: dotnet restore

    - name: Build (release)
      if: >-
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'dry'))
      run: dotnet build --configuration Release --no-restore /p:Version=${{ env.VERSION }}

    - name: Pack
      if: >-
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'dry'))
      run: dotnet pack --configuration Release --no-build --output nupkgs /p:Version=${{ env.VERSION }}

    - name: NuGet login (OIDC Trusted Publishing)
      if: >-
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
      id: nuget-login
      uses: nuget/login@v1
      with:
        user: TimeWarp.Enterprises

    - name: Trusted publishing probe result
      if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
      run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml."

    - name: Push to NuGet
      if: >-
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release')
      run: >
        dotnet nuget push nupkgs/*.nupkg
        --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
